spring.application.name=salary-management

# SQLite file DB (override with SPRING_DATASOURCE_URL in deployment)
spring.datasource.url=jdbc:sqlite:./data/salary.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer; keep the pool small
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# The "seed" context loads the sample data (db/seed/*.csv) into an EMPTY database; it is skipped if employees already exist.
# To start WITHOUT sample data set SPRING_LIQUIBASE_CONTEXTS to any other value, e.g. no-seed.
# Do NOT set it to empty: Liquibase reads an empty context list as "run every changeset", which includes the seed.
spring.liquibase.contexts=seed

management.endpoints.web.exposure.include=health,info
